name: Publish release
run-name: Release from CI run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Container workflow run ID for the current main commit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Serialize manual releases, including attempts to release the same version.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify successful CI run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Verify the run tested current main in this repository
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Enter the numeric run ID from the successful Container workflow URL."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container.yaml" --jq '.id')
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg latest "$latest" --argjson workflow "$workflow_id" '
            .repository.full_name == $repo and
            .workflow_id == $workflow and
            .head_branch == "main" and
            .head_sha == $latest and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and .conclusion == "success"
          ' run.json > /dev/null || {
            echo "::error::Choose a successful Container run for the current head of main."
            exit 1
          }
          echo "sha=$latest" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish tested version
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: release-metadata
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate saved version and prevent duplicate releases
        id: version
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const saved = JSON.parse(readFileSync("release-metadata/version.json", "utf8"));
            if (saved.sha !== process.env.EXPECTED_SHA ||
                !/^\d+\.\d+\.\d+$/.test(saved.version)) {
              throw new Error("Expected a stable version calculated for the tested commit");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${saved.version}\n`);
          '
          version=$(jq -r '.version' release-metadata/version.json)
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "::error::Version v$version has already been released. Test a new commit instead."
            exit 1
          fi
      - name: Lowercase registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Ensure main has not moved since verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$EXPECTED_SHA" ]; then
            echo "::error::Main changed. Release its latest successful Container run instead."
            exit 1
          fi
      - name: Publish approved image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Record release and create its Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TESTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          gh release create "v$VERSION" --target "$TESTED_SHA" \
            --title "v$VERSION" --generate-notes --latest
          echo "Published v$VERSION from $TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
