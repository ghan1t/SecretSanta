name: Container

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.2'
      - uses: gittools/actions/gitversion/execute@v4.7.0
        id: gitversion
        with:
          configFilePath: GitVersion.yml
      - name: Show calculated version
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: echo "Calculated version $VERSION" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  container:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.semver }}
      - name: Prepare image artifact directory
        run: mkdir -p "$RUNNER_TEMP/release-bundle"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.version.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/release-bundle/image.tar

      - name: Save tested image metadata
        env:
          VERSION: ${{ needs.version.outputs.semver }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { sha256 } from "./.github/scripts/release-utils.mjs";
            const directory = `${process.env.RUNNER_TEMP}/release-bundle`;
            writeFileSync(`${directory}/version.json`, JSON.stringify({
              version: process.env.VERSION,
              sha: process.env.GITHUB_SHA,
              branch: process.env.GITHUB_REF_NAME,
              repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              archiveSha256: await sha256(`${directory}/image.tar`)
            }));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Explain manual publication
        if: github.event_name != 'pull_request'
        run: |
          echo "Checks and image build passed. Nothing has been published." >> "$GITHUB_STEP_SUMMARY"
          echo "Run Publish release on main with run ID $GITHUB_RUN_ID to publish this saved image." >> "$GITHUB_STEP_SUMMARY"
