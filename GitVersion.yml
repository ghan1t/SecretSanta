# Simplified GitFlow: short-lived feature/hotfix branches merge into main.
# Releases are approved in Actions, which creates the version tag automatically.
workflow: GitHubFlow/v1
tag-prefix: '[vV]'
commit-message-incrementing: Enabled
branches:
  main:
    regex: ^main$
    mode: ManualDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
      when-current-commit-tagged: true
  feature:
    regex: ^features?[/-](?<BranchName>.+)
    mode: ContinuousDelivery
    increment: Inherit
    source-branches: [main]
  hotfix:
    regex: ^hotfix(es)?[/-](?<BranchName>.+)
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    source-branches: [main]
